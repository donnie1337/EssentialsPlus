name: EssentialsPlus
version: 1.0.0-SNAPSHOT
main: com.donnie1337.essentialsplus.EssentialsPlus
api-version: '26.2'
author: donnie1337
description: Essentials customizado para Paper 26.2.
website: https://github.com/donnie1337/EssentialsPlus
softdepend:
  - LoginPlus
  - ChatPlus
commands:
  tpa:
    description: Solicita teleporte até outro jogador.
    usage: /tpa <jogador>
  tpahere:
    description: Solicita que outro jogador se teleporte até você.
    usage: /tpaqui <jogador>
    aliases:
      - tpaqui
  tpaccept:
    description: Aceita uma solicitação de teleporte.
    usage: /tpaceitar [jogador]
    aliases:
      - tpaceitar
  tpdeny:
    description: Recusa uma solicitação de teleporte.
    usage: /tpnegar [jogador]
    aliases:
      - tpnegar
  tpacancel:
    description: Cancela uma solicitação de teleporte enviada.
    usage: /tpacancelar [jogador]
    aliases:
      - tpacancelar
  home:
    description: Teleporta para uma home salva.
    usage: /home <nome>
  homes:
    description: Lista suas homes salvas.
    usage: /homes
  sethome:
    description: Salva uma home na sua localização atual.
    usage: /sethome <nome>
  delhome:
    description: Remove uma home salva.
    usage: /delhome <nome>
permissions:
  essentialsplus.tpa:
    description: Permite usar /tpa.
    default: true
  essentialsplus.tpahere:
    description: Permite usar /tpaqui.
    default: true
  essentialsplus.tpaccept:
    description: Permite aceitar solicitações de teleporte.
    default: true
  essentialsplus.tpdeny:
    description: Permite recusar solicitações de teleporte.
    default: true
  essentialsplus.tpacancel:
    description: Permite cancelar solicitações de teleporte enviadas.
    default: true
  essentialsplus.home:
    description: Permite usar /home.
    default: true
  essentialsplus.homes:
    description: Permite usar /homes.
    default: true
  essentialsplus.sethome:
    description: Permite usar /sethome.
    default: true
  essentialsplus.delhome:
    description: Permite usar /delhome.
    default: true
