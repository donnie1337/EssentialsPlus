name: EssentialsPlus
version: 1.0.0-SNAPSHOT
main: com.donnie1337.essentialsplus.EssentialsPlus
api-version: '26.2'
author: donnie1337
description: Essentials customizado para Paper 26.2.
website: https://github.com/donnie1337/EssentialsPlus
softdepend:
  - LoginPlus
  - ChatPlus
  - CargoPlus
commands:
  v:
    description: Ativa ou desativa o modo vanish.
    usage: /v
    permission: essentialsplus.vanish
  tp:
    description: Teleporta jogadores diretamente. Comando exclusivo para staff.
    usage: /tp <jogador> [jogador]
    permission: essentialsplus.teleport
  tphere:
    description: Teleporta um jogador até você. Comando exclusivo para staff.
    usage: /tphere <jogador>
    permission: essentialsplus.teleport
  tpa:
    description: Solicita teleporte até outro jogador.
    usage: /tpa <jogador>
    permission: essentialsplus.tpa
  tpaqui:
    description: Solicita que outro jogador se teleporte até você.
    usage: /tpaqui <jogador>
    permission: essentialsplus.tpa
  tpaccept:
    description: Aceita uma solicitação de teleporte.
    usage: /tpaceitar [jogador]
    aliases:
      - tpaceitar
    permission: essentialsplus.tpa
  tpdeny:
    description: Recusa uma solicitação de teleporte.
    usage: /tpnegar [jogador]
    aliases:
      - tpnegar
    permission: essentialsplus.tpa
  tpacancel:
    description: Cancela uma solicitação de teleporte enviada.
    usage: /tpcancelar [jogador]
    aliases:
      - tpcancelar
    permission: essentialsplus.tpa
  home:
    description: Teleporta para uma home salva.
    usage: /home <nome>
    permission: essentialsplus.home
  homes:
    description: Lista suas homes salvas.
    usage: /homes
    permission: essentialsplus.homes
  sethome:
    description: Salva uma home na sua localização atual.
    usage: /sethome <nome>
    permission: essentialsplus.sethome
  delhome:
    description: Remove uma home salva.
    usage: /delhome <nome>
    permission: essentialsplus.delhome
permissions:
  essentialsplus.admin:
    description: Permite usar todos os comandos e recursos administrativos do EssentialsPlus.
    default: op
    children:
      essentialsplus.vanish: true
      essentialsplus.teleport: true
      essentialsplus.tpa: true
      essentialsplus.home: true
      essentialsplus.homes: true
      essentialsplus.sethome: true
      essentialsplus.delhome: true
  essentialsplus.vanish:
    description: Permite usar o /v.
    default: false
  essentialsplus.teleport:
    description: Permite usar os comandos de teleporte direto da staff.
    default: op
  essentialsplus.tpa:
    description: Permite usar todos os comandos do sistema de TPA.
    default: true
    children:
      essentialsplus.tpaqui: true
      essentialsplus.tpaceitar: true
      essentialsplus.tpnegar: true
      essentialsplus.tpacancelar: true
  essentialsplus.tpaqui:
    description: Permissão interna do comando /tpaqui.
    default: false
  essentialsplus.tpaceitar:
    description: Permissão interna do comando /tpaceitar.
    default: false
  essentialsplus.tpnegar:
    description: Permissão interna do comando /tpnegar.
    default: false
  essentialsplus.tpacancelar:
    description: Permissão interna do comando /tpcancelar.
    default: false
  essentialsplus.home:
    description: Permite usar /home.
    default: true
  essentialsplus.homes:
    description: Permite usar /homes.
    default: true
  essentialsplus.sethome:
    description: Permite usar /sethome.
    default: true
  essentialsplus.delhome:
    description: Permite usar /delhome.
    default: true
