# ============================================================
# EssentialsPlus - Configuração principal
# ============================================================
# Este arquivo reúne apenas configurações de funcionamento.
# As mensagens permanecem preservadas exatamente como já estão.
#
# Cores do Minecraft: &0-9, &a-f, &k-o e &r
# Placeholders: {player}, {target}, {home}, {seconds}, {message}, {limit}
#
# Após alterar este arquivo, use o reload do plugin ou reinicie o servidor.
# ============================================================

tpa:
  enabled: true
  request-timeout-seconds: 30
  max-pending-requests: 5
  teleport-delay-seconds: 0
  cancel-on-move: false
  cancel-on-damage: false
  cancel-on-death: true
  cancel-on-disconnect: true

homes:
  enabled: true
  limits:
    default: 1

teleport:
  staff:
    enabled: true

messages:
  tpa:
    prefix: "&b&lᴛᴘᴀ &8• &r"
    sistema-desativado: "&cO sistema de TPA está desativado."
    jogador-nao-encontrado: "&cJogador não encontrado."
    nao-pode-ser-voce: "&cVocê não pode enviar uma solicitação para si mesmo."
    precisa-estar-autenticado: "&cVocê precisa estar autenticado para executar este comando."
    jogador-nao-autenticado: "&cO jogador ainda não está autenticado."
    recebimento-desativado:
      jogador: "&c{player}&f não está recebendo solicitações de TPA no momento."
      proprio: "&cVocê desativou o recebimento de TPA."
    solicitacao:
      enviada: "&aVocê pediu para se teleportar até {player}&f!"
      recebida: "&b{player}&f está pedindo para se teleportar até você."
      recebida-aqui: "&b{player}&f está pedindo para que você se teleporte até ele."
    resposta:
      aceita: "&aVocê aceitou o pedido de teleporte de {player}&f!"
