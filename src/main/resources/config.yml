  tell:
    player-only: "Comando disponível apenas para jogadores."
    unknown-command: "&d&lᴛᴇʟʟ &8• &rComando não encontrado."
    usage: "&d&lᴛᴇʟʟ &8• &rUse /tell <jogador> [mensagem]."
    reply-usage: "&d&lᴛᴇʟʟ &8• &rUse /r <mensagem>."
    player-not-found: "&d&lᴛᴇʟʟ &8• &cJogador não encontrado."
    cannot-self: "&d&lᴛᴇʟʟ &8• &cVocê não pode enviar uma mensagem para si mesmo."
