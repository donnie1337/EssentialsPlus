      jogador-ja-aceitou: "&cNão é possível cancelar porque {player}&f já aceitou o pedido."
      jogador-recusou: "&cNão é possível cancelar porque {player}&f recusou o pedido."
      solicitacao-expirada: "&cNão é possível cancelar porque o pedido expirou."
      aceitar-cancelada: "&cNão foi possível aceitar pois {player}&f cancelou a solicitação."
      recusar-cancelada: "&cNão foi possível recusar pois {player}&f cancelou a solicitação."
