buttons:
  spacing: "  "
  accept:
    enabled: true
    text: "&a&lAQUI"
    hover: "&7Clique para aceitar a solicitação."
  deny:
    enabled: true
    text: "&c&lAQUI"
    hover: "&7Clique para recusar a solicitação."
  cancel:
    enabled: true
    text: "&fClique &c&lAQUI&f para cancelar"
    hover: "&7Clique para cancelar sua solicitação de TPA."
