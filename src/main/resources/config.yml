      falhou: "&cNão foi possível realizar o teleporte."
    uso:
      tpa: "&fUse: &e/tpa <jogador>"

  tp:
    prefix: "&c&lᴛᴘ &8• &r"
    jogador-apenas: "&cEste comando precisa ser usado por um jogador."
    teleportado-ate: "&aTeleportado até {player}&f."
