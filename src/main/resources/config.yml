tpa:
  enabled: true
  request-timeout-seconds: 20
  max-pending-requests: 5
  teleport-delay-seconds: 0
  cancel-on-move: false
  cancel-on-damage: false
  cancel-on-death: true
  cancel-on-disconnect: true

homes:
  enabled: true
  # A estrutura de limites já fica preparada para a futura integração por cargo.
  # -1 significa ilimitado.
  limits:
    default: 1

messages:
  prefix: "&c&lSERVIDOR &7• &r"
  player-not-found: "Jogador não encontrado."
  cannot-self: "Você não pode enviar uma solicitação para si mesmo."
  disabled: "O sistema de TPA está desativado."
  no-permission: "Você não tem permissão para executar este comando."
  auth-required: "Você precisa estar autenticado para executar este comando."
  target-not-authenticated: "O jogador ainda não está autenticado."
  request-sent: "Você pediu para se teleportar até {player}!"
  request-received: "{player}&f está pedindo para se teleportar até você."
  request-here-received: "{player}&f está pedindo para que você se teleporte até ele."
  request-accepted: "Você aceitou o pedido de teleporte de {player}!"
  request-accepted-sender: "{player} aceitou seu pedido de teleporte. Levando você até lá..."
  request-denied: "Você recusou o pedido de teleporte de {player}."
  request-denied-sender: "{player} recusou seu pedido de teleporte."
  request-expired: "O pedido de teleporte de {player} expirou."
  no-request: "Você não possui solicitações de TPA pendentes."
  request-cancelled: "Solicitação de TPA cancelada."
  pending-request: "Você já possui uma solicitação de TPA pendente. Aguarde ela expirar ou ser respondida."
  teleporting: "Teleportando em {seconds}s. Não se mova."
  teleport-cancelled: "Teleporte cancelado porque você se moveu."
  target-offline: "O jogador não está mais online."
  teleport-failed: "Não foi possível realizar o teleporte."
  too-many-requests: "Este jogador já possui muitas solicitações pendentes."
  home-saved: "Home {home} salva com sucesso."
  home-teleported: "Teleportado para a home {home}."
  home-deleted: "Home {home} removida com sucesso."
  home-not-found: "Home {home} não encontrada."
  homes-empty: "Você ainda não possui nenhuma home."
  homes-list: "Suas homes: {homes}"
  homes-disabled: "O sistema de Homes está desativado."
  home-limit: "Você atingiu o limite de {limit} home(s)."
  invalid-home-name: "Nome de home inválido. Use apenas letras, números, _ ou - (até 32 caracteres)."
  home-world-unavailable: "Não foi possível carregar o mundo desta home."
  home-location-invalid: "A localização desta home não é mais válida."
  usage-home: "Uso: /home <nome>"
  usage-homes: "Uso: /homes"
  usage-sethome: "Uso: /sethome <nome>"
  usage-delhome: "Uso: /delhome <nome>"

buttons:
  spacing: "  "
  accept:
    enabled: true
    text: "&a&lAQUI"
    hover: "&7Clique para aceitar a solicitação."
  deny:
    enabled: true
    text: "&c&lAQUI"
    hover: "&7Clique para recusar a solicitação."
  cancel:
    enabled: true
    text: "&fClique &c&lAQUI&f para cancelar"
    hover: "&7Clique para cancelar sua solicitação de TPA."
