tpa:
  enabled: true
  request-timeout-seconds: 20
  max-pending-requests: 5
  teleport-delay-seconds: 0
  cancel-on-move: false
  cancel-on-damage: false
  cancel-on-death: true
  cancel-on-disconnect: true

homes:
  enabled: true
  # A estrutura de limites ja fica preparada para a futura integracao por cargo.
  # -1 significa ilimitado.
  limits:
    default: 1

messages:
  prefix: "&8[&6EssentialsPlus&8] &r"
  player-not-found: "&cJogador não encontrado."
  cannot-self: "&cVocê não pode enviar uma solicitação para si mesmo."
  disabled: "&cO sistema de TPA está desativado."
  no-permission: "&cVocê não tem permissão para isso."
  auth-required: "&cFaça login ou se registre antes de usar o sistema de TPA."
  target-not-authenticated: "&cO jogador ainda não está autenticado."
  request-sent: "&aSolicitação de TPA enviada para &f{player}&a."
  request-received: "&e{player} &fquer se teleportar até você."
  request-here-received: "&e{player} &fquer que você se teleporte até ele."
  request-accepted: "&aSolicitação de TPA de &f{player} &aaceita."
  request-accepted-sender: "&a{player} &faceitou sua solicitação de TPA."
  request-denied: "&cSolicitação de TPA de &f{player} &crecusada."
  request-denied-sender: "&c{player} &frecusou sua solicitação de TPA."
  request-expired: "&cA solicitação de TPA de &f{player} &cexpirou."
  no-request: "&cVocê não possui solicitações de TPA pendentes."
  request-cancelled: "&eSolicitação de TPA cancelada."
  pending-request: "&cVocê já possui uma solicitação de TPA pendente. Aguarde ela expirar ou ser respondida."
  teleporting: "&aTeleportando em &f{seconds}s&a. Não se mova."
  teleport-cancelled: "&cTeleporte cancelado porque você se moveu."
  target-offline: "&cO jogador não está mais online."
  teleport-failed: "&cNão foi possível realizar o teleporte."
  too-many-requests: "&cEste jogador já possui muitas solicitações pendentes."
  home-saved: "&aHome &f{home} &asalva com sucesso."
  home-teleported: "&aTeleportado para a home &f{home}&a."
  home-deleted: "&aHome &f{home} &aremovida com sucesso."
  home-not-found: "&cHome &f{home} &cnão encontrada."
  homes-empty: "&eVocê ainda não possui nenhuma home."
  homes-list: "&6&lSuas homes: &f{homes}"
  homes-disabled: "&cO sistema de Homes está desativado."
  home-limit: "&cVocê atingiu o limite de &f{limit} &chome(s)."
  invalid-home-name: "&cNome de home inválido. Use apenas letras, números, _ ou - (até 32 caracteres)."

buttons:
  spacing: "  "
  accept:
    enabled: true
    text: "&a&l[ ACEITAR ]"
    hover: "&7Clique para aceitar a solicitação."
  deny:
    enabled: true
    text: "&c&l[ RECUSAR ]"
    hover: "&7Clique para recusar a solicitação."
  cancel:
    enabled: true
    text: "&e&l[ CANCELAR ]"
    hover: "&7Clique para cancelar sua solicitação de TPA."
