      ja-aceita: "&eVocê já aceitou esta solicitação de TPA."
      aceitar-ja-aceita: "&cNão foi possível aceitar pois você já aceitou a solicitação."
      recusar-ja-aceita: "&cNão foi possível recusar pois a solicitação já foi aceita."
      recusada: "&cVocê recusou o pedido de teleporte de {player}&f."
      recusada-remetente: "&c{player}&f recusou seu pedido de teleporte."
      ja-recusada: "&eVocê já recusou esta solicitação de TPA."
      aceitar-ja-recusada: "&cNão foi possível aceitar pois você já recusou a solicitação."
      recusar-ja-recusada: "&cNão foi possível recusar pois você já recusou a solicitação."
    expiracao:
      expirada: "&cO pedido de teleporte de {player}&f expirou."
      nao-pode-responder: "&cVocê não pode aceitar ou recusar porque o convite expirou."
