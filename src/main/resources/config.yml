tpa:
  enabled: true
  request-timeout-seconds: 20
  max-pending-requests: 5
  teleport-delay-seconds: 0
  cancel-on-move: false
  cancel-on-damage: false
  cancel-on-death: true
  cancel-on-disconnect: true

homes:
  enabled: true
  # A estrutura de limites já fica preparada para a futura integração por cargo.
  # -1 significa ilimitado.
  limits:
    default: 1

messages:
  prefix: "&c&lSERVIDOR &7• &r"
  tpa-prefix: ""
  unknown-command: "Comando não encontrado."
  player-not-found: "Jogador não encontrado."
  cannot-self: "Você não pode enviar uma solicitação para si mesmo."
  disabled: "O sistema de TPA está desativado."
  no-permission: "Você não tem permissão para executar este comando."
  auth-required: "Você precisa estar autenticado para executar este comando."
  target-not-authenticated: "O jogador ainda não está autenticado."
  request-sent: "&b&lTPA &8• &rVocê pediu para se teleportar até {player}&f!"
  request-received: "\n&b&lTPA &8• &r{player}&f está pedindo para se teleportar até você.\nClique {accept} para aceitar ou {deny} para negar!\n"
  request-here-received: "\n&b&lTPA &8• &r{player}&f está pedindo para que você se teleporte até ele.\nClique {accept} para aceitar ou {deny} para negar!\n"
  request-accepted: "&b&lTPA &8• &rVocê aceitou o pedido de teleporte de {player}&f!"
  request-accepted-sender: "&b&lTPA &8• &r{player}&f aceitou seu pedido de teleporte. Levando você até lá..."
  request-denied: "&b&lTPA &8• &rVocê recusou o pedido de teleporte de {player}&f."
  request-denied-sender: "&b&lTPA &8• &r{player}&f recusou seu pedido de teleporte."
  request-expired: "&b&lTPA &8• &rO pedido de teleporte de {player}&f expirou."
  request-already-accepted: "&b&lTPA &8• &rVocê já aceitou este pedido de teleporte."
  request-already-denied: "&b&lTPA &8• &rVocê já recusou este pedido de teleporte."
  request-expired-cannot-respond: "&b&lTPA &8• &rVocê não pode aceitar ou recusar porque o convite expirou."
  request-already-cancelled: "&b&lTPA &8• &rVocê já cancelou este pedido de teleporte."
  no-request: "&b&lTPA &8• &rVocê não possui solicitações de TPA pendentes."
  request-cancelled: "&b&lTPA &8• &rSolicitação de TPA cancelada."
  pending-request: "&b&lTPA &8• &rVocê já possui uma solicitação de TPA pendente. Aguarde ela expirar ou ser respondida."
  teleporting: "&b&lTPA &8• &rTeleportando em {seconds}s. Não se mova."
  teleport-cancelled: "&b&lTPA &8• &rTeleporte cancelado porque você se moveu."
  target-offline: "&b&lTPA &8• &rO jogador não está mais online."
  teleport-failed: "&b&lTPA &8• &rNão foi possível realizar o teleporte."
  too-many-requests: "&b&lTPA &8• &rEste jogador já possui muitas solicitações pendentes."
  home-saved: "Home {home} salva com sucesso."
  home-teleported: "Teleportado para a home {home}."
  home-deleted: "Home {home} removida com sucesso."
  home-not-found: "Home {home} não encontrada."
  homes-empty: "Você ainda não possui nenhuma home."
  homes-list: "Suas homes: {homes}"
  homes-disabled: "O sistema de Homes está desativado."
  home-limit: "Você atingiu o limite de {limit} home(s)."
  invalid-home-name: "Nome de home inválido. Use apenas letras, números, _ ou - (até 32 caracteres)."
  home-world-unavailable: "Não foi possível carregar o mundo desta home."
  home-location-invalid: "A localização desta home não é mais válida."
  usage-home: "Uso: /home <nome>"
  usage-homes: "Uso: /homes"
  usage-sethome: "Uso: /sethome <nome>"
  usage-delhome: "Uso: /delhome <nome>"

buttons:
  spacing: "  "
  accept:
    enabled: true
    text: "&a&lAQUI"
    hover: "&7Clique para aceitar a solicitação."
  deny:
    enabled: true
    text: "&c&lAQUI"
    hover: "&7Clique para negar a solicitação."
  cancel:
    enabled: true
    text: "&fClique &c&lAQUI&f para cancelar"
    hover: "&7Clique para cancelar sua solicitação de TPA."
