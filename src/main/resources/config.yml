# ============================================================
# EssentialsPlus - Configuração principal
# ============================================================
#
# Cores do Minecraft:
# &0-9, &a-f, &k-o e &r
#
# Placeholders disponíveis nas mensagens:
# {player}, {target}, {home}, {seconds}, {message}, {limit}
#
# Alterações neste arquivo exigem /reload do plugin ou reinício
# do servidor para serem aplicadas.
# ============================================================


tpa:
  enabled: true
  request-timeout-seconds: 20
  max-pending-requests: 5
  teleport-delay-seconds: 0
  cancel-on-move: false
  cancel-on-damage: false
  cancel-on-death: true
  cancel-on-disconnect: true

homes:
  enabled: true
  limits:
    default: 1

teleport:
  staff:
    enabled: true

messages:
  tpa:
    prefix: "&b&lᴛᴘᴀ &8• &r"
    sistema-desativado: "O sistema de TPA está desativado."
    jogador-nao-encontrado: "Jogador não encontrado."
    nao-pode-ser-voce: "Você não pode enviar uma solicitação para si mesmo."
    precisa-estar-autenticado: "Você precisa estar autenticado para executar este comando."
    jogador-nao-autenticado: "O jogador ainda não está autenticado."
    recebimento-desativado:
      jogador: "{player}&f não está recebendo solicitações de TPA no momento."
      proprio: "Você desativou o recebimento de TPA."
    solicitacao:
      enviada: "Você pediu para se teleportar até {player}&f!"
      recebida: "{player}&f está pedindo para se teleportar até você."
      recebida-aqui: "{player}&f está pedindo para que você se teleporte até ele."
    resposta:
      aceita: "Você aceitou o pedido de teleporte de {player}&f!"
      aceita-remetente: "{player}&f aceitou seu pedido de teleporte. Levando você até lá..."
      ja-aceita: "Você já aceitou esta solicitação de TPA."
      recusada: "Você recusou o pedido de teleporte de {player}&f."
      recusada-remetente: "{player}&f recusou seu pedido de teleporte."
      ja-recusada: "Você já recusou esta solicitação de TPA."
    expiracao:
      expirada: "O pedido de teleporte de {player}&f expirou."
      nao-pode-responder: "Você não pode aceitar ou recusar porque o convite expirou."
    cancelamento:
      ja-cancelada: "Você já cancelou este pedido de teleporte."
      cancelada: "Solicitação de TPA cancelada."
      cancelada-pelo-jogador: "Solicitação de TPA cancelada pois {player}&f cancelou."
      jogador-ja-aceitou: "Não é possível cancelar porque {player}&f já aceitou o pedido."
      jogador-recusou: "Não é possível cancelar porque {player}&f recusou o pedido."
      solicitacao-expirada: "Não é possível cancelar porque o pedido expirou."
    pendencia:
      nenhuma: "Você não possui solicitações de TPA pendentes."
      ja-existe: "Você já possui uma solicitação de TPA pendente. Aguarde ela expirar ou ser respondida."
      limite-atingido: "Este jogador já possui muitas solicitações pendentes."
    teleporte:
      iniciando: "Teleportando em {seconds}s. Não se mova."
      cancelado-movimento: "Teleporte cancelado porque você se moveu."
      jogador-offline: "O jogador não está mais online."
      falhou: "Não foi possível realizar o teleporte."
    uso:
      tpa: "Use /tpa <jogador>."

  tp:
    prefix: "&c&lᴛᴘ &8• &r"
    jogador-apenas: "Este comando precisa ser usado por um jogador."
    teleportado-ate: "Teleportado até {player}&f."
    jogador-teleportado-ate: "{player}&f foi teleportado até {target}&f."
    jogador-teleportado-aqui: "{player}&f foi teleportado até você."
    teleportado-pela-equipe: "Você foi teleportado por {player}&f."
    uso:
      tp: "Uso: /tp <jogador> [jogador]"

  home:
    prefix: "&a&lʜᴏᴍᴇ &8• &r"
    salva: "Home {home} salva com sucesso."
    teleportado: "Teleportado para a home {home}."
    removida: "Home {home} removida com sucesso."
    nenhuma: "Você ainda não possui nenhuma home."
    nao-encontrada: "A home {home} não foi encontrada."
    lista: "Suas homes: {homes}"
    sistema-desativado: "O sistema de Homes está desativado."
    limite-atingido: "Você atingiu o limite de {limit} home(s)."
    nome-invalido: "Nome de home inválido. Use apenas letras, números, _ ou - (até 32 caracteres)."
    mundo-indisponivel: "Não foi possível carregar o mundo desta home."
    localizacao-invalida: "A localização desta home não é mais válida."
    teleporte-falhou: "Não foi possível realizar o teleporte para esta home."
    uso:
      home: "Uso: /home <nome>"
      homes: "Uso: /homes"
      sethome: "Uso: /sethome <nome>"
      delhome: "Uso: /delhome <nome>"

  chat:
    prefix: "&e&lᴄʜᴀᴛ &8• &r"
    comando-nao-encontrado: "Comando não encontrado."
    jogador-nao-encontrado: "Jogador não encontrado ou offline."
    nao-pode-ser-voce: "Você não pode enviar uma mensagem para si mesmo."
    mensagens-desativadas: "O jogador desativou as mensagens privadas."
    nenhuma-conversa: "Você não possui nenhuma conversa privada recente."
    tell:
      uso: "Use /tell <jogador> <mensagem>."
    resposta:
      uso: "Use /r <mensagem>."
    formato:
      remetente: "Você → &f{player}&8: &r{message}"
      destinatario: "{player} → &fVocê&8: &r{message}"

  utilidades:
    prefix: "&7&lᴜᴛɪʟɪᴅᴀᴅᴇs &8• &r"
  invisibilidade:
    prefix: "&5&lɪɴᴠɪsɪʙɪʟɪᴅᴀᴅᴇ &8• &r"
  cargo:
    prefix: "&6&lᴄᴀʀɢᴏ &8• &r"
  geral:
    comando-nao-encontrado: "&e&lᴄʜᴀᴛ &8• &rComando não encontrado."
    jogador-apenas: "Este comando precisa ser usado por um jogador."
    jogador-nao-encontrado: "Jogador não encontrado."
    sem-permissao: "&e&lᴄʜᴀᴛ &8• &rComando não encontrado."
    precisa-estar-autenticado: "Você precisa estar autenticado para executar este comando."
    jogador-nao-autenticado: "O jogador ainda não está autenticado."

  prefix: "&b&lᴛᴘᴀ &8• &r"
  tpa-prefix: "&b&lᴛᴘᴀ &8• &r"
  no-permission: "&e&lᴄʜᴀᴛ &8• &rComando não encontrado."
